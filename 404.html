<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>這一頁不在書裡｜地政說書人</title>
<meta name="robots" content="noindex">
<script>
  // 短網址轉址：/links → /#links、/pricing → /#pricing
  (function () {
    var pages = ["home", "office", "pricing", "course", "tools", "about", "links", "contact"];
    var seg = location.pathname.replace(/^\/+|\/+$/g, "").split("/").pop().toLowerCase();
    if (pages.indexOf(seg) > -1) location.replace("/#" + seg);
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0F1014;color:#EFE9DC;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;text-align:center;padding:24px;box-sizing:border-box;}
  .seal{width:72px;height:72px;margin:0 auto 22px;border:2px solid #B9604D;color:#B9604D;border-radius:4px;display:grid;place-items:center;font-family:serif;font-weight:900;font-size:22px;line-height:1.05;}
  h1{font-family:"Noto Serif TC",serif;font-size:26px;letter-spacing:.08em;margin:0 0 10px;}
  p{color:#B6B0A4;margin:0 0 28px;}
  a{display:inline-block;padding:12px 26px;background:#D5B15C;color:#14150F;text-decoration:none;border-radius:2px;font-weight:500;letter-spacing:.06em;}
</style>
</head>
<body>
  <main>
    <div class="seal" aria-hidden="true">說<br>書</div>
    <h1>這一頁不在書裡</h1>
    <p>網址可能打錯了，回到目錄重新找找吧。</p>
    <a href="/">回首頁</a>
  </main>
</body>
</html>
